      <text x="14"  y="72"  fill="#f5e9d6">Bronze Dawn</text>
      <text x="162" y="72"  fill="#e8f5ef">Cocain</text>
      <text x="14"  y="172" fill="#e6fffb">Sòng Phẳng</text>
